<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DRG Company – Online Fashion Store</title>
<style>
:root{--o:#f68b1e;--od:#d9730d;--bg:#f1f1f2;--card:#fff;--tx:#282828;--mu:#75757a;--ln:#e5e5e8;--bar:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#232327;--tx:#f0f0f2;--mu:#a0a0a8;--ln:#38383e;--bar:#232327}}
:root[data-theme="dark"]{--bg:#17171a;--card:#232327;--tx:#f0f0f2;--mu:#a0a0a8;--ln:#38383e;--bar:#232327}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--o);outline-offset:2px}
.top{background:var(--bar);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.strip{background:var(--o);color:#fff;text-align:center;font-size:13px;padding:5px 8px}
.row{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;padding:10px 14px}
.logo{font-weight:800;font-size:24px;color:var(--o);letter-spacing:-1px;white-space:nowrap}
.logo small{display:block;font-size:10px;font-weight:600;color:var(--mu);letter-spacing:0;margin-top:-4px}
.search{flex:1;display:flex;min-width:0}
.search input{flex:1;min-width:0;padding:11px 14px;border:1px solid var(--ln);border-radius:6px 0 0 6px;background:var(--bg);color:var(--tx);font:inherit}
.search button{background:var(--o);color:#fff;border:0;padding:0 20px;border-radius:0 6px 6px 0;font-weight:700}
.nav{display:flex;gap:6px;white-space:nowrap}
.nav a{padding:8px 11px;border-radius:6px;font-weight:600;font-size:14px}.nav a:hover{background:var(--bg);color:var(--od)}
.nav .cartb{background:var(--o);color:#fff}.nav .cartb:hover{background:var(--od);color:#fff}
main{max-width:1180px;margin:14px auto;padding:0 12px}
.hero{display:grid;grid-template-columns:220px 1fr;gap:12px}
.cats{background:var(--card);border-radius:6px;padding:6px 0}
.cats button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx);padding:10px 16px;font-size:14px}
.cats button:hover,.cats button.on{background:var(--bg);color:var(--od);font-weight:700}
.banner{border-radius:6px;background:linear-gradient(120deg,#f68b1e,#ffb25b 60%,#ffd9a6);color:#fff;padding:34px 36px;display:flex;flex-direction:column;justify-content:center;min-height:240px}
.banner h1{margin:0 0 8px;font-size:38px;line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.banner p{margin:0 0 18px;font-size:17px;max-width:420px}
.btn{background:#282828;color:#fff;border:0;border-radius:6px;padding:11px 22px;font-weight:700;align-self:flex-start}
.btn.o{background:var(--o)}.btn.o:hover{background:var(--od)}.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0}
.perks div{background:var(--card);border-radius:6px;padding:12px 14px;font-size:13px;color:var(--mu)}.perks b{display:block;color:var(--tx);font-size:14px}
.sec{background:var(--card);border-radius:6px;margin-bottom:14px;overflow:hidden}
.sec h2{margin:0;padding:12px 16px;font-size:17px;background:var(--o);color:#fff}
.sec h2.plain{background:none;color:var(--tx);border-bottom:1px solid var(--ln)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1px;background:var(--ln)}
.p{background:var(--card);padding:10px;position:relative;display:flex;flex-direction:column}
.p img{width:100%;aspect-ratio:1/1.1;object-fit:cover;border-radius:4px;background:var(--bg);cursor:pointer}
.p h3{font-size:14px;font-weight:500;margin:8px 0 4px;min-height:40px}
.pr{font-weight:700;font-size:17px}.old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:400}
.tag{position:absolute;top:16px;right:16px;background:#fdecd6;color:var(--od);font-weight:700;font-size:12px;padding:2px 7px;border-radius:4px}
.p .btn{width:100%;margin-top:8px;text-align:center}
.stars{color:var(--o);font-size:13px}
.pg{padding:18px}.pg h1{margin:0 0 12px;font-size:22px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top;font-size:14px}
.ci{display:flex;gap:10px;align-items:center}.ci img{width:56px;height:56px;object-fit:cover;border-radius:4px}
.qty button{width:28px;height:28px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:4px}
.two{display:grid;grid-template-columns:1fr 340px;gap:14px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.f{width:100%;padding:10px;border:1px solid var(--ln);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
.sum{background:var(--bg);border-radius:6px;padding:14px}.sum div{display:flex;justify-content:space-between;margin:6px 0}
.ok{background:#e6f6ea;color:#1e6b34;padding:14px;border-radius:6px}.err{background:#fdeaea;color:#a12626;padding:10px;border-radius:6px;margin-top:10px}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px;background:#fdecd6;color:var(--od)}.pill.d{background:#e6f6ea;color:#1e6b34}
.ord{border:1px solid var(--ln);border-radius:6px;padding:12px;margin-bottom:10px}.ord .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
footer{background:#282828;color:#ccc;margin-top:20px;padding:26px 14px;font-size:13px}
footer .in{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}footer b{color:#fff;display:block;margin-bottom:6px}footer a{display:block;padding:2px 0}
@media(max-width:820px){.hero,.two{grid-template-columns:1fr}.cats{display:flex;overflow-x:auto}.cats button{white-space:nowrap;width:auto}.perks{grid-template-columns:1fr 1fr}.row{flex-wrap:wrap}.search{order:3;flex-basis:100%}.banner h1{font-size:28px}.banner{padding:24px}}
</style>

let PX={},AL=false,AT="orders",NS=0;const PL=()=>[...P.map(x=>({...x,...(PX[x.id]||{})})),...Object.values(PX).filter(v=>v.custom)].filter(x=>!x.del);const img=x=>x.img||IMG[x.id];const soft=()=>{NS=1;render();NS=0};
let RAW=[],ST={};const OR=ds=>{const l=[];ds.forEach(d=>Object.entries(d.data()).forEach(([k,v])=>{if(k.startsWith("o_"))l.push({...v,id:v.ref,status:ST[v.ref]||"New"})}));return l.sort((a,b)=>b.at-a.at)};
let cart={},cat="All",term="",db=null,isAdmin=false,orders=[],done=null;
const $=s=>document.querySelector(s),app=$("#app");
const U=n=>"UGX "+n.toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const count=()=>Object.values(cart).reduce((a,b)=>a+b,0);
const total=()=>Object.entries(cart).reduce((a,[i,q])=>a+(PL().find(x=>x.id==i)||{n:"Unavailable item",p:0}).p*q,0);
function card(x){return `<div class="p">${x.o>x.p?`<span class="tag">-${Math.round((1-x.p/x.o)*100)}%</span>`:""}<img src="${img(x)}" alt="${esc(x.n)}" data-add="${x.id}"><h3>${esc(x.n)}</h3><div><span class="pr">${U(x.p)}</span>${x.o>x.p?`<span class="old">${U(x.o)}</span>`:""}</div><div class="stars">★★★★☆</div><button class="btn o" data-add="${x.id}">Add to cart</button></div>`}
function home(){const l=PL().filter(x=>(cat=="All"||x.c==cat)&&x.n.toLowerCase().includes(term.toLowerCase()));
return `<div class="hero"><div class="cats">${CATS.map(c=>`<button class="${c==cat?"on":""}" data-cat="${c}">${c=="All"?"All categories":c}</button>`).join("")}</div>
<div class="banner"><h1>Fresh styles.<br>Fair prices.</h1><p>Shirts, sets, polos and denim from DRG Company. Order online, we deliver to your door.</p><button class="btn" data-cat="All" data-go="deals">Shop now</button></div></div>
<div class="perks"><div><b>Fast delivery</b>Across Uganda</div><div><b>Pay on delivery</b>Check before you pay</div><div><b>Easy support</b>We reply by email</div><div><b>Quality picks</b>Handpicked items</div></div>
<div class="sec" id="deals"><h2>${term?`Results for “${esc(term)}”`:cat=="All"?"Top deals – up to 25% off":cat}</h2>${l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="pg">No products found. Try another word or <a href="#home" data-cat="All" style="color:var(--od);font-weight:700">view all products</a>.</div>`}</div>`}
function cartV(){const e=Object.entries(cart);if(!e.length)return `<div class="sec"><div class="pg"><h1>Your cart is empty</h1><p>Add something you like and it will show up here.</p><a class="btn o" href="#home" style="display:inline-block">Start shopping</a></div></div>`;
return `<div class="sec"><div class="pg"><h1>Shopping cart (${count()})</h1><table>${e.map(([i,q])=>{const x=(PL().find(y=>y.id==i)||{n:"Unavailable item",p:0});return `<tr><td><div class="ci"><img src="${img(x)}" alt=""><span>${esc(x.n)}</span></div></td><td>${U(x.p)}</td><td class="qty"><button data-q="${i}" data-d="-1" aria-label="Less">−</button> ${q} <button data-q="${i}" data-d="1" aria-label="More">+</button></td><td><b>${U(x.p*q)}</b></td><td><button class="btn g" data-rm="${i}">Remove</button></td></tr>`}).join("")}</table>
<p style="text-align:right;font-size:18px">Total: <b>${U(total())}</b></p><div class="acts" style="justify-content:flex-end"><a class="btn g" href="#home" style="padding:11px 22px;border-radius:6px">Continue shopping</a><a class="btn o" href="#checkout" style="padding:11px 22px;border-radius:6px">Checkout</a></div></div></div>`}
function checkout(){if(done)return `<div class="sec"><div class="pg"><div class="ok"><b>Thank you, ${esc(done.name)}! Order ${esc(done.ref)} received.</b><br>We will contact you at ${esc(done.email)} or ${esc(done.phone)} to confirm delivery.</div><p><a class="btn o" href="#home" style="display:inline-block;padding:11px 22px;border-radius:6px">Back to shop</a></p></div></div>`;
if(!count())return cartV();
return `<div class="two"><div class="sec"><div class="pg"><h1>Delivery details</h1><form id="of"><label>Full name</label><input class="f" name="name" required><label>Phone number</label><input class="f" name="phone" type="tel" required placeholder="07XX XXX XXX"><label>Email address</label><input class="f" name="email" type="email" required><label>Delivery address (town, area, landmark)</label><textarea class="f" name="addr" rows="3" required></textarea><label>Payment</label><select class="f" name="pay"><option>Pay on delivery</option><option>MTN Mobile Money</option><option>Airtel Money</option></select><div id="er"></div><button class="btn o" style="margin-top:14px;width:100%">Place order · ${U(total())}</button></form></div></div>
<div class="sec"><div class="pg"><h1>Order summary</h1><div class="sum">${Object.entries(cart).map(([i,q])=>`<div><span>${q} × ${esc((PL().find(x=>x.id==i)||{n:"Unavailable item",p:0}).n)}</span><b>${U((PL().find(x=>x.id==i)||{n:"Unavailable item",p:0}).p*q)}</b></div>`).join("")}<div style="border-top:1px solid var(--ln);padding-top:8px"><b>Total</b><b>${U(total())}</b></div></div></div></div></div>`}
function about(){return `<div class="sec"><div class="pg"><h1>Contact DRG Company</h1><p>Questions about an order, sizes or delivery? Write to us and we will reply by email.</p><p><b>Email:</b> <a href="mailto:${ADMIN_EMAIL}" style="color:var(--od)">${ADMIN_EMAIL}</a><br><b>Location:</b> Uganda, with delivery nationwide<br><b>Payment:</b> Cash on delivery, MTN Mobile Money, Airtel Money<br><b>Delivery:</b> 1–3 days in major towns, free above UGX 100,000</p></div></div>`}
function ordersV(){return `<h1>Customer orders (${orders.length})</h1>${!orders.length?"<p>No orders yet. New orders appear here live.</p>":orders.map(o=>`<div class="ord"><div class="h"><b>${esc(o.ref)} · ${esc(o.name)}</b><span class="pill ${o.status=="Replied"?"d":""}">${esc(o.status)}</span></div><div style="color:var(--mu);font-size:13px">${new Date(o.at).toLocaleString()}</div><p style="margin:8px 0">${esc(o.items)}<br><b>${U(o.total)}</b> · ${esc(o.pay)}</p><div style="font-size:14px">📞 ${esc(o.phone)} · ✉ ${esc(o.email)}<br>📍 ${esc(o.addr)}</div><div class="acts"><a class="btn o" style="padding:9px 16px;border-radius:6px" data-reply="${esc(o.id)}" href="${mail(o)}">Reply by email</a><button class="btn g" data-st="${esc(o.id)}">Mark as ${o.status=="Replied"?"New":"Replied"}</button></div></div>`).join("")}`}
function prodsV(){const gr='style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px"';
return `<h1>Products</h1>`+PL().map(x=>`<div class="ord" data-row="${esc(x.id)}"><div class="ci" style="margin-bottom:8px"><img src="${img(x)}" alt=""><b>${esc(x.n)}</b></div><div ${gr}><div><label>Name</label><input class="f" data-f="n" value="${esc(x.n)}"></div><div><label>Price (UGX)</label><input class="f" type="number" min="0" data-f="p" value="${x.p}"></div><div><label>Old price</label><input class="f" type="number" min="0" data-f="o" value="${x.o}"></div><div><label>Deduct from price</label><input class="f" type="number" min="0" data-f="d" placeholder="0"></div></div><div class="acts"><button class="btn o" data-save="${esc(x.id)}">Save changes</button><button class="btn g" data-del="${esc(x.id)}">Remove product</button></div></div>`).join("")+`<form id="af" class="ord"><b>Add a new product</b><div ${gr}><div><label>Name</label><input class="f" name="n" required></div><div><label>Price (UGX)</label><input class="f" name="p" type="number" min="0" required></div><div><label>Old price (optional)</label><input class="f" name="o" type="number" min="0"></div><div><label>Category</label><select class="f" name="c">${CATS.slice(1).map(c=>`<option>${c}</option>`).join("")}</select></div><div><label>Photo</label><input class="f" name="i" type="file" accept="image/*" required></div></div><div id="ae"></div><button class="btn o" style="margin-top:12px">Add product</button></form>`}
function admin(){if(!AL)return `<div class="sec"><div class="pg"><h1>Admin login</h1><form id="lf" style="max-width:340px"><label>Admin email</label><input class="f" name="u" type="email" autocomplete="username" required><label>Password</label><input class="f" name="p" type="password" autocomplete="current-password" required><div id="le"></div><button class="btn o" style="margin-top:14px;width:100%">Log in</button></form></div></div>`;
return `<div class="sec"><div class="pg"><div class="acts" style="margin:0 0 12px"><button class="btn ${AT=="orders"?"o":"g"}" data-tab="orders">Orders (${orders.length})</button><button class="btn ${AT=="products"?"o":"g"}" data-tab="products">Products</button><button class="btn g" data-lo="1">Log out</button></div>${AT=="orders"?ordersV():prodsV()}</div></div>`}
function mail(o){return "mailto:"+encodeURIComponent(o.email)+"?subject="+encodeURIComponent("Your DRG Company order "+o.ref)+"&body="+encodeURIComponent(`Hello ${o.name},\n\nThank you for ordering from DRG Company.\nOrder ${o.ref}: ${o.items}\nTotal: ${U(o.total)}\n\nWe will deliver to: ${o.addr}.\n\nRegards,\nDRG Company`)}
function render(){const h=(location.hash||"#home").slice(1);if(h!="checkout")done=done&&h=="checkout"?done:null;
app.innerHTML=({home,cart:cartV,checkout,about,admin}[h]||home)();$("#cc").textContent=count();if(!NS)scrollTo(0,0)}
function upd(){$("#cc").textContent=count()}
document.addEventListener("click",e=>{const t=e.target.closest("[data-add],[data-cat],[data-q],[data-rm],[data-st]");if(!t)return;const d=t.dataset;
if(d.add){cart[d.add]=(cart[d.add]||0)+1;upd();t.textContent=t.tagName=="BUTTON"?"Added ✓":t.textContent;if(t.tagName=="BUTTON")setTimeout(()=>t.textContent="Add to cart",900)}
else if(d.cat){cat=d.cat;term="";if(location.hash!="#home"&&location.hash)location.hash="#home";else{render();if(d.go)document.getElementById(d.go).scrollIntoView()}}
else if(d.q){cart[d.q]+=+d.d;if(cart[d.q]<1)delete cart[d.q];render()}
else if(d.rm){delete cart[d.rm];render()}
else if(d.st&&db){const o=orders.find(x=>x.id==d.st);db.collection("status").doc(o.id).set({v:o.status=="Replied"?"New":"Replied"})}});
document.addEventListener("click",e=>{const r=e.target.closest("[data-reply]");if(r&&db)db.collection("status").doc(r.dataset.reply).set({v:"Replied"})});
document.addEventListener("submit",async e=>{e.preventDefault();
if(e.target.id=="sf"){term=$("#q").value;cat="All";location.hash="#home";render();return}
if(e.target.id=="of"){const f=Object.fromEntries(new FormData(e.target));const ref="DRG-"+Date.now().toString(36).toUpperCase();
const items=Object.entries(cart).map(([i,q])=>q+" × "+(PL().find(x=>x.id==i)||{n:"Unavailable item",p:0}).n).join("; ");
const o={ref,name:f.name,phone:f.phone,email:f.email,addr:f.addr,pay:f.pay,items,total:total(),status:"New",at:Date.now()};
try{if(!db)throw 0;await db.collection("orders").doc(ref).set({["o_"+ref]:o})}catch(x){
$("#er").innerHTML=`<div class="err">We could not save your order online. Tap to send it by email instead: <a href="mailto:${ADMIN_EMAIL}?subject=${encodeURIComponent("New order "+ref)}&body=${encodeURIComponent(JSON.stringify(o,null,1))}" style="text-decoration:underline;font-weight:700">Email order to DRG Company</a></div>`;return}
cart={};done=o;render()}});

const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const readImg=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const k=Math.min(1,420/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.72))};i.onerror=no;i.src=URL.createObjectURL(f)});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-tab],[data-lo],[data-save],[data-del]");if(!t)return;const d=t.dataset;
if(d.tab){AT=d.tab;render()}else if(d.lo){firebase.auth().signOut()}
else if((d.save||d.del)&&db){const id=d.save||d.del,x=PL().find(y=>y.id==id);if(!x||(d.del&&!confirm("Remove this product from the shop?")))return;
const row=t.closest(".ord"),g=f=>row.querySelector('[data-f="'+f+'"]').value;
const rec={id:x.id,n:g("n").trim()||x.n,p:Math.max(0,(+g("p")||0)-(+g("d")||0)),o:+g("o")||x.o,c:x.c};if(x.custom){rec.custom=1;rec.img=x.img}if(d.del)rec.del=1;
try{await db.collection("products").doc(String(id)).set(rec)}catch(er){alert("Could not save: "+(er.message||er))}}});
document.addEventListener("submit",async e=>{const id=e.target.id;if(id!="lf"&&id!="af")return;e.preventDefault();const f=new FormData(e.target);
if(id=="lf"){try{await firebase.auth().signInWithEmailAndPassword(f.get("u").trim(),f.get("p"))}catch(er){$("#le").innerHTML='<div class="err">Wrong email or password.</div>'}}
else{try{if(!db)throw 0;const pid="c"+Date.now().toString(36),p=+f.get("p");await db.collection("products").doc(pid).set({id:pid,n:f.get("n").trim(),p,o:+f.get("o")||p,c:f.get("c"),custom:1,img:await readImg(f.get("i"))});e.target.reset()}catch(er){$("#ae").innerHTML='<div class="err">Could not add the product. Check the photo and try again.</div>'}}});
addEventListener("hashchange",render);render();
const FB={apiKey:"YOUR_API_KEY",authDomain:"YOUR_PROJECT_ID.firebaseapp.com",projectId:"YOUR_PROJECT_ID",appId:"YOUR_APP_ID"};
let unsub=[];
try{firebase.initializeApp(FB);db=firebase.firestore();
db.collection("products").onSnapshot(s=>{PX={};s.docs.forEach(d=>PX[d.id]=d.data());const h=(location.hash||"#home").slice(1);if(h=="home"||h=="cart"||(h=="admin"&&!document.activeElement.matches("input,select")))soft()},()=>{});
firebase.auth().onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];isAdmin=AL=!!u;orders=[];RAW=[];
if(u){unsub.push(db.collection("status").onSnapshot(s=>{ST={};s.docs.forEach(d=>ST[d.id]=d.data().v);orders=OR(RAW);if((location.hash||"").slice(1)=="admin")soft()}));
unsub.push(db.collection("orders").onSnapshot(s=>{RAW=s.docs;orders=OR(RAW);if((location.hash||"").slice(1)=="admin")soft()}))}
render()})}catch(e){}
</script></body></html>
